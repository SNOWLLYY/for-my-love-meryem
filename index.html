<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#040207">
<title>For Meryem, my love</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Jost:wght@300&display=swap">
<style>
/* Layout: one full-screen 3D space scene on canvas; two tiny captions at the bottom, one sound toggle in the corner. Single dark world by choice. */
:root {
  --space: #040207;
  --text: #f8eef0;
  --soft: #bfa9ae;
  --red: #ff3b4e;
  --font-display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --font-body: "Jost", "Avenir Next", "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--space); color: var(--text);
  font-family: var(--font-body); font-weight: 300;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
#space { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
.captions {
  position: fixed; left: 0; right: 0; pointer-events: none;
  bottom: max(28px, calc(env(safe-area-inset-bottom, 0px) + 20px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; justify-items: center; gap: 8px; text-align: center;
}
.captions p { margin: 0; opacity: 0; transform: translateY(6px); transition: opacity 2.4s ease, transform 2.4s ease; }
.captions p.show { opacity: 1; transform: none; }
#forHer { font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: clamp(28px, 6vw, 40px); color: var(--red); text-shadow: 0 0 24px rgba(255, 40, 60, .55); }
#madeBy { font-family: var(--font-display); font-style: italic; font-size: clamp(16px, 3.6vw, 20px); color: var(--soft); letter-spacing: .02em; }
#replay { font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--soft); }
.sound {
  position: fixed; z-index: 2;
  top: max(14px, calc(env(safe-area-inset-top, 0px) + 10px));
  right: max(14px, calc(env(safe-area-inset-right, 0px) + 10px));
  font: inherit; font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
  color: var(--soft); background: transparent; border: 1px solid rgba(191, 169, 174, .3);
  border-radius: 999px; padding: 7px 14px; cursor: pointer;
}
.sound:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
.start {
  position: fixed; inset: 0; z-index: 1; border: 0; margin: 0; cursor: pointer;
  background: transparent; color: var(--text); font: inherit;
  display: grid; place-content: center; justify-items: center; gap: 14px; text-align: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  transition: opacity 1.6s ease;
}
.start.hide { opacity: 0; pointer-events: none; }
.start .for { font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: clamp(38px, 9vw, 64px); color: var(--red); text-shadow: 0 0 30px rgba(255, 40, 60, .5); }
.start .go { font-size: 12px; letter-spacing: .34em; text-transform: uppercase; color: var(--text); animation: breathe 2.4s ease-in-out infinite; }
.start .hint { font-size: 12px; letter-spacing: .08em; color: var(--soft); }
.start:focus-visible { outline: none; }
.start:focus-visible .go { text-decoration: underline; text-underline-offset: 6px; }
@keyframes breathe { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .start .go { animation: none; } }
</style>
<style>[hidden]{display:none!important}</style>
</head>
<body>
<canvas id="space" aria-label="Animation: words saying I love you drift through space into a black hole, which explodes and the words form a heart"></canvas>
<button class="sound" id="soundBtn" type="button" aria-pressed="true">sound on</button>
<button class="start" id="start" type="button">
  <span class="for" id="startFor">for Meryem</span>
  <span class="go">tap to begin</span>
  <span class="hint">turn your sound on</span>
</button>
<div class="captions">
  <p id="forHer">for Meryem</p>
  <p id="madeBy">made by Mohamed, at 3 am, 11/3/2026</p>
  <p id="replay">tap to watch again</p>
</div>

<script>
/* ===== Personalize here ===== */
const HER = "Meryem";
const WORDS = ["I love you"];   // add more if you like, e.g. "Je t'aime", "Seni seviyorum", "أحبك"
const TOTAL = 230;              // words swallowed in all; new ones keep drifting in from deep space
/* ============================ */

const $ = s => document.querySelector(s);
const cv = $("#space"), ctx = cv.getContext("2d");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const smooth = p => p * p * (3 - 2 * p);
const TAU = Math.PI * 2;
$("#forHer").textContent = "for " + HER + ", my love";
$("#startFor").textContent = "for " + HER;

/* ---------- viewport, camera, pre-rendered sky ---------- */
let W = 0, H = 0, F = 0, boost = 1, phone = false, COUNT = 140;
const D = 1000, NEAR = -380;          // nothing is ever drawn closer to the camera than this
let yaw = 0, tilt = .3, zoom = .72;
const sky = document.createElement("canvas"), sctx = sky.getContext("2d");
function resize() {
  W = innerWidth; H = innerHeight; phone = Math.min(W, H) < 600;
  const dpr = Math.min(devicePixelRatio || 1, phone ? 1.5 : 2);
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  F = D * Math.min(W, H * 1.1) / 1150;
  boost = Math.max(1, 14 / (30 * F / D));
  // background drawn once: haze + faint stars, a little larger than the screen for parallax
  sky.width = (W + 120) * dpr; sky.height = (H + 120) * dpr; sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.fillStyle = "#040207"; sctx.fillRect(0, 0, W + 120, H + 120);
  const haze = (x, y, r, c, a) => { const g = sctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${c},${a})`); g.addColorStop(1, `rgba(${c},0)`); sctx.fillStyle = g; sctx.fillRect(x - r, y - r, r * 2, r * 2); };
  sctx.globalCompositeOperation = "lighter";
  haze((W + 120) * .28, (H + 120) * .3, Math.max(W, H) * .6, "120,20,60", .18);
  haze((W + 120) * .76, (H + 120) * .68, Math.max(W, H) * .55, "70,20,110", .16);
  haze((W + 120) * .55, (H + 120) * .45, Math.max(W, H) * .35, "160,40,70", .07);
  for (let i = 0; i < (phone ? 260 : 420); i++) {
    sctx.fillStyle = `rgba(255,246,240,${rand(.15, .6)})`;
    const r = Math.random() ** 3 * 1.3 + .3;
    sctx.fillRect(rand(0, W + 120), rand(0, H + 120), r, r);
  }
  sctx.globalCompositeOperation = "source-over";
}
resize(); addEventListener("resize", resize);
const TWINKLE = Array.from({ length: 45 }, () => ({ x: Math.random(), y: Math.random(), r: rand(1, 1.9), ph: rand(0, TAU), sp: rand(.5, 1.6) }));

function proj(x, y, z) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw), ct = Math.cos(tilt), st = Math.sin(tilt);
  const x1 = x * cy - z * sy, z1 = x * sy + z * cy;
  const y2 = y * ct - z1 * st, z2 = Math.max(NEAR, y * st + z1 * ct);
  const k = F * zoom / (z2 + D);
  return [W / 2 + x1 * k, H / 2 + y2 * k, k, z2];
}

/* ---------- vectors ---------- */
const norm = v => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
function rotate(u, n, ang) {          // rotate u around axis n
  const c = Math.cos(ang), s = Math.sin(ang), nu = cross(n, u), d = dot(n, u) * (1 - c);
  return [u[0] * c + nu[0] * s + n[0] * d, u[1] * c + nu[1] * s + n[1] * d, u[2] * c + nu[2] * s + n[2] * d];
}
// a random direction that never points toward the camera
function dirAway() {
  for (;;) {
    const v = [rand(-1, 1), rand(-1, 1), rand(-1, 1)], l = Math.hypot(...v);
    if (l > .2 && l <= 1 && v[2] / l > -.3) return [v[0] / l, v[1] / l, v[2] / l];
  }
}
const DISK_AXIS = [0, -1, 0];

/* ---------- heart ---------- */
const heartXY = t => [16 * Math.sin(t) ** 3, 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)];
const HS = 21;
function heartTarget(i) {
  const edge = COUNT * .7;
  let t, s, zr;
  if (i < edge) { t = i / edge * TAU + rand(-.02, .02); s = 1; zr = 40; }
  else { t = rand(0, TAU); s = Math.sqrt(Math.random()) * .82; zr = 80; }
  const [hx, hy] = heartXY(t);
  return { x: hx * HS * s, y: -(hy + 2.5) * HS * s, z: rand(-zr, zr) };
}
const PALETTE = ["255,48,64", "255,82,82", "232,22,46", "255,140,128", "255,226,216"];
const DISK_COLORS = ["255,244,225", "255,170,90", "255,70,55", "190,22,40"];

/* ---------- state ---------- */
let words, disk, sparks, ripples, dust, stage, t, stageT, R, Rgoal, swallowed, pull, flash, shock, shake, gulp, canReplay, captionOn;
function newWord(i, far) {
  const u = dirAway();
  let n = norm(cross(u, dirAway())); if (n[1] > 0) n = n.map(v => -v);
  return {
    text: WORDS[i % WORDS.length], color: PALETTE[i % PALETTE.length], size: rand(.85, 1.25),
    u, n0: n, r: far ? rand(1500, 2100) : rand(420, 1900), r0: 0,
    state: "drift", capAt: 3.2 + Math.random() ** .8 * 8, alpha: far ? 1 : 0,
    ph: rand(0, TAU), rs: rand(.2, .5), x: 0, y: 0, z: 0, rot: 0,
    target: heartTarget(i), delay: rand(0, .7), tw: rand(0, TAU)
  };
}
function reset() {
  COUNT = phone ? 105 : 140;
  t = 0; stage = "drift"; stageT = 0; R = 0; Rgoal = 0; swallowed = 0; pull = 1;
  flash = 0; shock = null; shake = 0; gulp = 0; canReplay = false; captionOn = false;
  tilt = .3; yaw = 0; zoom = .72; sparks = []; ripples = [];
  words = Array.from({ length: COUNT }, (_, i) => newWord(i, false));
  disk = Array.from({ length: reduced ? 200 : (phone ? 340 : 620) }, () => {
    const rr = 1.45 + 4.3 * Math.random() ** 1.8, q = (rr - 1.45) / 4.3;
    return { rr, a: rand(0, TAU), h: rand(-1, 1) * rand(0, 1), c: DISK_COLORS[q < .12 ? 0 : q < .35 ? 1 : q < .65 ? 2 : 3],
      free: false, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, life: 1 };
  });
  dust = Array.from({ length: phone ? 30 : 50 }, () => ({ a: rand(0, TAU), r: rand(380, 620), y: rand(-260, 260), sp: rand(.05, .18), s: rand(.6, 1.8) }));
  $("#forHer").classList.remove("show"); $("#madeBy").classList.remove("show"); $("#replay").classList.remove("show");
}
reset();
cv.addEventListener("click", () => { if (canReplay) { reset(); playSong(); } });

/* ---------- music + sound effects (start on her first tap) ---------- */
// the song (Angel, 1:45 to 2:12), played once with a fade in and a fade out
const song = new Audio("music.mp3");
song.preload = "auto"; song.playsInline = true;
let songDuck = 1, songReturn = false;
let ac = null, master, droneGain, droneFilter, windGain, windFilter, soundOn = true, lastGulp = 0, started = false;
let reverb = null;
function noiseBuffer(sec, brown) {
  const buf = ac.createBuffer(1, ac.sampleRate * sec, ac.sampleRate), d = buf.getChannelData(0);
  let lastV = 0;
  for (let i = 0; i < d.length; i++) {
    const white = Math.random() * 2 - 1;
    if (brown) { lastV = (lastV + .02 * white) / 1.02; d[i] = lastV * 3.5; } else d[i] = white;
  }
  return buf;
}
// a big, dark space for the impact to ring out in
function makeReverb(sec) {
  const len = ac.sampleRate * sec, ir = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
  const conv = ac.createConvolver(), wet = ac.createGain();
  conv.buffer = ir; wet.gain.value = .55; conv.connect(wet).connect(master);
  return conv;
}
function initAudio() {
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = soundOn ? .9 : 0; master.connect(ac.destination);
  reverb = makeReverb(4.5);
  // low rumble of the black hole
  droneFilter = ac.createBiquadFilter(); droneFilter.type = "lowpass"; droneFilter.frequency.value = 160;
  droneGain = ac.createGain(); droneGain.gain.value = 0;
  [55, 55.6, 82.4].forEach(f => { const o = ac.createOscillator(); o.type = "triangle"; o.frequency.value = f; o.connect(droneFilter); o.start(); });
  droneFilter.connect(droneGain).connect(master);
  // dark air being dragged in
  const air = ac.createBufferSource(); air.buffer = noiseBuffer(4, true); air.loop = true;
  windFilter = ac.createBiquadFilter(); windFilter.type = "lowpass"; windFilter.frequency.value = 200; windFilter.Q.value = .5;
  windGain = ac.createGain(); windGain.gain.value = 0;
  air.connect(windFilter).connect(windGain);
  windGain.connect(master);
  const send = ac.createGain(); send.gain.value = .25; windGain.connect(send).connect(reverb);
  air.start();
}
function updateSfx() {
  if (!ac) return;
  const now = ac.currentTime, grow = clamp((R - 5) / RMAX);
  const hum = stage === "boom" || !started ? 0 : stage === "critical" ? .16 : grow * .1;
  const rush = stage === "boom" || !started ? 0 : stage === "critical" ? .5 : grow * .3 * (.5 + .5 * Math.min(1, pull / 4));
  droneGain.gain.setTargetAtTime(hum, now, .6);
  droneFilter.frequency.setTargetAtTime(140 + pull * 20, now, .5);
  windGain.gain.setTargetAtTime(rush, now, .6);
  windFilter.frequency.setTargetAtTime(stage === "critical" ? 1400 : 180 + pull * 90, now, .5);
}
// the inhale before the blast: music dips, dark air swells, then a split second of silence
function riseSound() {
  if (!ac) return;
  const now = ac.currentTime;
  songDuck = .3;
  const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = noiseBuffer(2, false);
  f.type = "lowpass"; f.frequency.setValueAtTime(150, now); f.frequency.exponentialRampToValueAtTime(3500, now + 1.5);
  g.gain.setValueAtTime(.0001, now); g.gain.exponentialRampToValueAtTime(.22, now + 1.48); g.gain.linearRampToValueAtTime(0, now + 1.52);
  src.connect(f).connect(g).connect(master); g.connect(reverb);
  src.start(now); src.stop(now + 1.6);
}
function boomSound() {
  if (!ac) return;
  const now = ac.currentTime;
  // heavy impact
  const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = noiseBuffer(4, true);
  f.type = "lowpass"; f.frequency.setValueAtTime(1600, now); f.frequency.exponentialRampToValueAtTime(70, now + 3);
  g.gain.setValueAtTime(1.2, now); g.gain.exponentialRampToValueAtTime(.001, now + 4);
  src.connect(f).connect(g).connect(master); g.connect(reverb);
  src.start(now);
  // deep drop underneath (the triangle keeps it audible on phone speakers)
  [["sine", 70, 24, .6], ["triangle", 120, 40, .18]].forEach(([type, from, to, vol]) => {
    const o = ac.createOscillator(), og = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(from, now); o.frequency.exponentialRampToValueAtTime(to, now + 2.8);
    og.gain.setValueAtTime(vol, now); og.gain.exponentialRampToValueAtTime(.001, now + 3);
    o.connect(og).connect(master); o.start(now); o.stop(now + 3.1);
  });
  // the music swells back in under the heart
  songDuck = .3; songReturn = true;
}
function setSound(on) {
  soundOn = on; song.muted = !on;
  if (master) master.gain.value = on ? .9 : 0;
  $("#soundBtn").textContent = on ? "sound on" : "sound off";
  $("#soundBtn").setAttribute("aria-pressed", on);
}
$("#soundBtn").addEventListener("click", () => setSound(!soundOn));
function playSong() {
  // let the sound effects play through the media channel too (iPhone silent switch)
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
  songDuck = 1;
  song.muted = !soundOn; song.volume = 0;
  try { song.currentTime = 0; } catch (e) {}
  const p = song.play(); if (p && p.catch) p.catch(() => {});
}
// fade in, dip before the blast, fade out at the end (phones that lock the volume just play it at full)
function updateSongVolume(dt) {
  if (song.paused) return;
  const d = song.duration || 27, at = song.currentTime;
  const target = .9 * clamp(at / 1.2) * clamp((d - at) / 3) * songDuck;
  try { song.volume = clamp(song.volume + (target - song.volume) * clamp(dt * 6)); } catch (e) {}
}
function begin() {
  if (started) return;
  try { if (!ac) initAudio(); ac.resume?.(); } catch (e) {}
  playSong(); reset(); started = true;
  $("#start").classList.add("hide");
}
$("#start").addEventListener("click", begin);

/* ---------- simulation ---------- */
const R0 = 36, RMAX = 115;
function go(s) { stage = s; stageT = 0; }

function update(dt) {
  t += dt; stageT += dt;
  const frac = Math.min(1, swallowed / (phone ? 170 : TOTAL));

  // slow cinematic camera: wide → closer as the hole grows → punch at the blast → pull back for the heart
  let zGoal = .72;
  if (stage === "drift" || stage === "pull") { zGoal = .72 + .28 * smooth(clamp((t - 2) / 9)) + .2 * frac; yaw = Math.sin(t * .09) * .28; }
  if (stage === "critical") zGoal = 1.32;
  if (stage === "boom") { zGoal = stageT < 1.2 ? 1.05 : .88 + .03 * Math.sin(stageT * .6); yaw = Math.sin(stageT * .3) * .4 * clamp((stageT - 2.5) / 3); tilt += (.04 - tilt) * dt * 1.2; }
  zoom += (zGoal - zoom) * clamp(dt * (stage === "critical" ? 1.6 : .7));

  if (stage === "drift" && t > 3) go("pull");
  if (stage === "pull" || stage === "drift") {
    Rgoal = t < 3 ? 0 : R0 * ease(clamp((t - 3) / 3)) + (RMAX - R0) * frac;
    pull = 1 + 3 * frac + Math.max(0, t - 15) * 1.2;
    if (t > 21) words.forEach(w => { if (w.state === "drift") w.capAt = 0; });
    if (stage === "pull" && words.every(w => w.state === "gone")) { go("critical"); riseSound(); }
  }
  if (stage === "critical") {
    pull = 6 + stageT * 6;
    shake = reduced ? 0 : stageT * 4;
    if (Math.random() < .3) ripples.push({ r: 1, a: .8 });
    if (stageT > 1.6) explode();
  }
  if (stage === "boom") {
    if (stageT > 4.6 && !captionOn) { captionOn = true; $("#forHer").classList.add("show"); setTimeout(() => $("#madeBy").classList.add("show"), 1500); }
    if (stageT > 7.5 && !canReplay) { canReplay = true; $("#replay").classList.add("show"); }
  }
  R += (Rgoal - R) * clamp(dt * (stage === "boom" ? 10 : 2.5));
  gulp *= Math.exp(-dt * 6);
  flash = Math.max(0, flash - dt * .8);
  if (shock) { shock.r += dt * 1500; shock.a = Math.max(0, shock.a - dt * .7); }
  ripples.forEach(r => { r.r += dt * 2; r.a -= dt * 1.4; });
  ripples = ripples.filter(r => r.a > 0);
  if (stage !== "critical") shake *= Math.exp(-dt * 4);

  updateSfx();
  if (songReturn) { songDuck = Math.min(1, songDuck + dt / 3.5); if (songDuck >= 1) songReturn = false; }
  updateSongVolume(dt);

  // accretion disk
  for (const p of disk) {
    if (p.free) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      const drag = Math.exp(-dt * 1.2); p.vx *= drag; p.vy *= drag; p.vz *= drag;
      p.life -= dt * .5;
    } else {
      const r = p.rr * Math.max(R, 1);
      p.a += 1.2 * pull * Math.pow(120 / Math.max(r, 20), 1.5) * dt;
      p.x = Math.cos(p.a) * r; p.z = Math.sin(p.a) * r; p.y = p.h * r * .05;
    }
  }

  for (const s of sparks) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.z += s.vz * dt;
    const drag = Math.exp(-dt * 1.6); s.vx *= drag; s.vy *= drag; s.vz *= drag;
    s.life -= dt * s.decay;
  }
  sparks = sparks.filter(s => s.life > 0);

  // words
  words.forEach((w, i) => {
    if (w.state === "drift" || w.state === "fall") {
      let f = 0;
      if (w.state === "drift") {
        w.alpha = Math.min(1, w.alpha + dt * .5);
        w.u = rotate(w.u, w.n0, .015 * dt);
        if (stage === "pull" && t >= w.capAt) { w.state = "fall"; w.r0 = w.r; }
      } else {
        f = smooth(clamp((w.r0 - w.r) / Math.max(1, w.r0 - R * 2.4)));
        const n = norm([w.n0[0] * (1 - f) + DISK_AXIS[0] * f, w.n0[1] * (1 - f) + DISK_AXIS[1] * f, w.n0[2] * (1 - f) + DISK_AXIS[2] * f]);
        const omega = 1.2 * pull * Math.pow(120 / Math.max(w.r, 20), 1.5);
        w.u = rotate(w.u, n, omega * dt);
        w.u[1] *= Math.exp(-dt * 2.5 * f);          // settle into the disk plane
        w.u = norm(w.u);
        // slow at first, faster and faster as the hole grows
        const speed = (30 + 50 * pull) * (1 + 150 / w.r) * .6 + w.r * .12 * pull;
        w.r -= speed * dt;
        if (w.r < R * 1.08) {
          w.state = "gone"; swallowed++; gulp = 1; ripples.push({ r: 1, a: .6 });
          const active = words.reduce((n2, o) => n2 + (o.state !== "gone"), 0);
          if (t < 15 && swallowed + active < (phone ? 170 : TOTAL)) { words[i] = newWord(i, true); words[i].state = "fall"; words[i].r0 = words[i].r; }
          return;
        }
      }
      // gentle floating sway, fading out as it is pulled in
      const sway = 1 - f;
      w.x = w.u[0] * w.r + Math.sin(t * .45 + w.ph) * 22 * sway;
      w.y = w.u[1] * w.r + Math.cos(t * .38 + w.ph) * 16 * sway;
      w.z = w.u[2] * w.r;
      w.rot = Math.sin(t * w.rs + w.ph) * .12 * sway;
    } else if (w.state === "burst") {
      w.x += w.vx * dt; w.y += w.vy * dt; w.z += w.vz * dt;
      const drag = Math.exp(-dt * 2.3); w.vx *= drag; w.vy *= drag; w.vz *= drag;
      if (stageT > 1.05) { w.state = "heart"; w.from = { x: w.x, y: w.y, z: w.z }; w.start = stageT + w.delay; }
    } else if (w.state === "heart") {
      const p = ease(clamp((stageT - w.start) / 3));
      const beat = 1 + .04 * Math.pow(Math.max(0, Math.sin(stageT * 2.4)), 14) * clamp(stageT - 5);
      w.x = w.from.x + (w.target.x * beat - w.from.x) * p;
      w.y = w.from.y + (w.target.y * beat - w.from.y) * p + Math.sin(t * .8 + w.ph) * 3 * p;
      w.z = w.from.z + (w.target.z - w.from.z) * p;
      w.rot *= .95;
    }
  });
}

function explode() {
  go("boom");
  flash = reduced ? .35 : .9; shake = reduced ? 0 : 12; Rgoal = 0;
  shock = { r: 0, a: 1 };
  boomSound();
  const colors = ["255,240,225", "255,170,90", "255,60,60", "255,30,50"];
  for (let i = 0; i < (reduced ? 40 : phone ? 110 : 200); i++) {
    const d = dirAway(), sp = rand(500, 1600);
    sparks.push({ x: 0, y: 0, z: 0, vx: d[0] * sp, vy: d[1] * sp * .6, vz: d[2] * sp, life: 1, decay: rand(.4, .8), c: colors[i % 4] });
  }
  for (const p of disk) {
    p.free = true;
    const dir = Math.atan2(p.z, p.x), sp = rand(400, 1300);
    p.vx = Math.cos(dir) * sp; p.vz = Math.max(-200, Math.sin(dir) * sp); p.vy = rand(-250, 250);
  }
  words.forEach(w => {
    const d = dirAway(), sp = rand(380, 1000);
    w.state = "burst"; w.alpha = 1;
    w.x = rand(-10, 10); w.y = rand(-10, 10); w.z = rand(-10, 10);
    w.vx = d[0] * sp; w.vy = d[1] * sp; w.vz = d[2] * sp;
  });
}

/* ---------- rendering ---------- */
function glow(x, y, r, c, a) {
  if (r <= 0 || a <= 0) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${c},${a})`); g.addColorStop(1, `rgba(${c},0)`);
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function drawDots(list) {
  for (const [sx, sy, k, a, c] of list) {
    ctx.fillStyle = `rgba(${c},${a})`;
    const s = Math.max(1, 2.6 * k);
    ctx.fillRect(sx - s / 2, sy - s / 2, s, s);
  }
}
// every word is drawn at one font size and scaled smoothly, so growing and zooming never step a pixel at a time
const BASE_PX = 48, WORD_FONT = `italic 600 ${BASE_PX}px "Cormorant Garamond", Georgia, serif`;
function drawWords(list) {
  ctx.font = WORD_FONT;
  for (const [sx, sy, k, w, squeeze, z2] of list) {
    // distance haze: far words are smaller and dimmer, like real depth
    let a = w.alpha * squeeze * clamp(1.25 - z2 / 1500, .25, 1);
    if (w.state === "heart") a *= .8 + .2 * Math.sin(t * 2.2 + w.tw);
    if (a <= .02) continue;
    const px = 30 * w.size * k * boost;
    if (px < 3 || sx < -150 || sx > W + 150 || sy < -60 || sy > H + 60) continue;
    const sc = px / BASE_PX;
    ctx.save();
    ctx.translate(sx, sy);
    if (w.rot) ctx.rotate(w.rot);
    ctx.scale(sc * (squeeze < 1 ? 1 + (1 - squeeze) * 1.5 : 1), sc * (squeeze < 1 ? .3 + .7 * squeeze : 1));
    ctx.fillStyle = `rgba(${w.color},${a.toFixed(3)})`;
    ctx.fillText(w.text, 0, 0);
    ctx.restore();
  }
}

function draw() {
  ctx.save();
  if (shake > .1) ctx.translate(rand(-shake, shake), rand(-shake, shake));

  // pre-rendered sky, shifted slightly with the camera for parallax
  ctx.drawImage(sky, -60 - yaw * 90, -60 + (tilt - .3) * 120, W + 120, H + 120);
  ctx.globalCompositeOperation = "lighter";
  for (const s of TWINKLE) {
    ctx.fillStyle = `rgba(255,246,240,${.15 + .55 * (Math.sin(t * s.sp + s.ph) * .5 + .5)})`;
    ctx.fillRect(s.x * W - yaw * 140, s.y * H, s.r, s.r);
  }

  const [hx, hy, hk] = proj(0, 0, 0);
  const Rs = R * hk * (1 + gulp * .06 + (stage === "critical" ? Math.sin(stageT * 40) * .06 * stageT : 0));

  const backD = [], frontD = [], backW = [], frontW = [];
  const diskVis = clamp(R / R0);
  for (const p of disk) {
    const a0 = p.free ? p.life : diskVis;
    if (a0 <= 0) continue;
    const [sx, sy, k, z2] = proj(p.x, p.y, p.z);
    const doppler = p.free ? 1 : .45 + .5 * (1 - Math.cos(p.a));
    (z2 > 0 ? backD : frontD).push([sx, sy, k, clamp(a0 * doppler * (1.2 - p.rr / 6.5)), p.c]);
  }
  for (const w of words) {
    if (w.state === "gone") continue;
    const [sx, sy, k, z2] = proj(w.x, w.y, w.z);
    const squeeze = w.state === "fall" ? clamp((w.r - R * 1.08) / (R * 1.6)) : 1;
    (z2 > 0 ? backW : frontW).push([sx, sy, k, w, squeeze, z2]);
  }
  backW.sort((a, b) => b[5] - a[5]); frontW.sort((a, b) => b[5] - a[5]);

  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  if (stage === "boom") glow(W / 2, H / 2, Math.min(W, H) * .6, "255,25,45", .18 * clamp((stageT - 2) / 2));
  drawDots(backD);
  ctx.globalCompositeOperation = "source-over";
  drawWords(backW);
  ctx.globalCompositeOperation = "lighter";

  if (Rs > .5) {
    const halo = ctx.createRadialGradient(hx, hy, Rs, hx, hy, Rs * 2.1);
    halo.addColorStop(0, `rgba(255,220,170,${.8 * diskVis})`);
    halo.addColorStop(.22, `rgba(255,95,60,${.4 * diskVis})`);
    halo.addColorStop(1, "rgba(200,20,40,0)");
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(hx, hy, Rs * 2.1, 0, TAU); ctx.fill();
    for (const r of ripples) {
      ctx.strokeStyle = `rgba(255,90,80,${r.a * .45 * diskVis})`; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(hx, hy, Rs * (1 + r.r), 0, TAU); ctx.stroke();
    }
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(hx, hy, Rs, 0, TAU); ctx.fill();
    ctx.strokeStyle = `rgba(255,236,215,${.9 * diskVis})`; ctx.lineWidth = Math.max(1, Rs * .03);
    ctx.beginPath(); ctx.arc(hx, hy, Rs * 1.02, 0, TAU); ctx.stroke();
    ctx.globalCompositeOperation = "lighter";
  }
  drawDots(frontD);

  for (const s of sparks) {
    const [sx, sy, k] = proj(s.x, s.y, s.z);
    ctx.fillStyle = `rgba(${s.c},${s.life})`;
    const sz = Math.max(1, 3 * k);
    ctx.fillRect(sx - sz / 2, sy - sz / 2, sz, sz);
  }
  if (stage === "boom" && stageT > 3) {
    const da = clamp((stageT - 3) / 3);
    for (const d of dust) {
      d.a += d.sp * .016;
      const [sx, sy, k] = proj(Math.cos(d.a) * d.r, d.y + Math.sin(t + d.a * 3) * 12, Math.sin(d.a) * d.r * .5);
      ctx.fillStyle = `rgba(255,70,70,${da * .5 * (.5 + .5 * Math.sin(t * 3 + d.a * 7))})`;
      const sz = Math.max(1, d.s * k * 3);
      ctx.fillRect(sx - sz / 2, sy - sz / 2, sz, sz);
    }
  }

  ctx.globalCompositeOperation = "source-over";
  drawWords(frontW);

  if (shock && shock.a > 0) {
    ctx.strokeStyle = `rgba(255,110,100,${shock.a * .7})`; ctx.lineWidth = 2 + shock.a * 10;
    ctx.beginPath(); ctx.ellipse(hx, hy, shock.r * hk, shock.r * hk * .3, 0, 0, TAU); ctx.stroke();
  }
  if (flash > 0) { ctx.fillStyle = `rgba(255,236,228,${flash})`; ctx.fillRect(-20, -20, W + 40, H + 40); }
  ctx.restore();
}

let last = 0;
function frame(ts) {
  const dt = Math.min(.05, (ts - (last || ts)) / 1000); last = ts;
  if (started) update(dt); else t += dt;
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
